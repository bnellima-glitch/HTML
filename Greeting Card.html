<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Greeting</title>
</head>
<body>
  <h1 id="greeting"></h1>

  <script>
    let now = new Date();
    let hour = now.getHours();
    let greeting;

    if (hour < 12) {
      greeting = "Good Morning!";
    } else if (hour < 17) {
      greeting = "Good Afternoon!";
    } else {
      greeting = "Good Evening!";
    }

    document.getElementById("greeting").innerText = greeting;
  </script>
</body>
</html>
