<!DOCTYPE html>
<html>
<head>
    <title>Simple Div Website</title>

    <style>
        body {
            margin: 0;
        }

        /* Row 1 */
        .top {
            display: flex;
            height: 25vh;
        }

        .logo {
            width: 25%;
        }

        .header {
            width: 75%;
        }

        /* Row 2 */
        .menu {
            height: 10vh;
        }

        /* Row 3 */
        .bottom {
            display: flex;
            height: 65vh;
        }

        .services {
            width: 25%;
        }

        .description {
            width: 75%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <!-- Row 1 -->
    <div class="top">
        <div class="logo">
            <iframe src="logo.html"></iframe>
        </div>

        <div class="header">
            <iframe src="heading.html"></iframe>
        </div>
    </div>

    <!-- Row 2 -->
    <div class="menu">
        <iframe src="menu.html"></iframe>
    </div>

    <!-- Row 3 -->
    <div class="bottom">
        <div class="services">
            <iframe src="services.html"></iframe>
        </div>

        <div class="description">
            <iframe src="description.html"></iframe>
        </div>
    </div>

</body>
</html>
