<!DOCTYPE html>
<html>
<head>
    <title>Simple Div Website</title>
    <style>
        body {
            margin: 0;
        }

        /* Row 1 */
        .top {
            display: flex;
            height: 25vh;
        }

        .logo {
            width: 25%;
            border: 3px solid dodgerblue;
        }

        .header {
            width: 75%;
            border: 3px solid steelblue;
        }

        /* Row 2 */
        .menu {
            height: 10vh;
            border: 3px solid green;
        }

        /* Row 3 */
        .bottom {
            display: flex;
            height: 65vh;
        }

        .services {
            width: 25%;
            border: 3px solid lightseagreen;
        }

        .description {
            width: 75%;
            border: 3px solid orange;
        }
    </style>
</head>

<body>

    <!-- Row 1 -->
    <div class="top">
        <div class="logo">
            <h2>Logo</h2>
        </div>
        <div class="header">
            <h2>Heading</h2>
        </div>
    </div>

    <!-- Row 2 -->
    <div class="menu">
        <h2>Menu</h2>
    </div>

    <!-- Row 3 -->
    <div class="bottom">
        <div class="services">
            <h2>Services</h2>
        </div>
        <div class="description">
            <h2>Description</h2>
        </div>
    </div>

</body>
</html>
