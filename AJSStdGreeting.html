<!DOCTYPE html>
<html ng-app="">
<head>
    <title>My First AngularJS Input</title>

    <!-- add angularjs -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body>

    <h2>Enter Name:</h2>

    <!-- input box -->
    <input type="text" ng-model="name" placeholder="type your name">

    <!-- display -->
    <h3>Hello {{ name }}</h3>

</body>
</html>
