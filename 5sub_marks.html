<html>
<head>
    <title>Student Marks Program</title>
</head>
<body>

<script>

var m1 = parseInt(prompt("Enter marks of Subject 1:"));
var m2 = parseInt(prompt("Enter marks of Subject 2:"));
var m3 = parseInt(prompt("Enter marks of Subject 3:"));
var m4 = parseInt(prompt("Enter marks of Subject 4:"));
var m5 = parseInt(prompt("Enter marks of Subject 5:"));

var total = m1 + m2 + m3 + m4 + m5;

var average = total / 5;

var grade;

if (average >= 90) {
    grade = "A+";
}
else if (average >= 75) {
    grade = "A";
}
else if (average >= 60) {
    grade = "B";
}
else if (average >= 50) {
    grade = "C";
}
else {
    grade = "Fail";
}

document.write("<h2>Result</h2>");
document.write("Total Marks = " + total + "<br>");
document.write("Average = " + average + "<br>");
document.write("Grade = " + grade);

</script>

</body>
</html>
