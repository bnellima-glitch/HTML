<html>
<head>
    <title>Registration Form</title>

    <style>
    body {
        font-family: Arial;
        background-color: lightgray;
    }

    h2 {
        text-align: center;
        color: black;
    }

    form {
        width: 350px;
        margin: auto;
        background-color: white;
        padding: 20px;
        border: 1px solid gray;
    }

    input {
        width: 100%;
        padding: 6px;
        margin-top: 5px;
        margin-bottom: 5px;
        border: 1px solid gray;
    }

    input[type="radio"],
    input[type="checkbox"] {
        width: auto;
    }

    button {
        width: 100%;
        padding: 8px;
        background-color: green;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background-color: darkgreen;
    }

    span {
        color: red;
        font-size: 12px;
    }
</style>

</head>

<body>

<h2>Registration Form</h2>

<form onsubmit="return validateForm()">

    Name:<br>
    <input type="text" id="name"><br>
    <span id="nameError"></span><br>

    Email:<br>
    <input type="text" id="email"><br>
    <span id="emailError"></span><br>

    Password:<br>
    <input type="password" id="password"><br>
    <span id="passwordError"></span><br>

    Confirm Password:<br>
    <input type="password" id="confirmPassword"><br>
    <span id="confirmPasswordError"></span><br>

    Mobile Number:<br>
    <input type="text" id="mobile"><br>
    <span id="mobileError"></span><br>

    Gender:<br>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female<br>
    <span id="genderError"></span><br>

    <input type="checkbox" id="terms"> I accept the Terms & Conditions<br>
    <span id="termsError"></span><br><br>

    <button type="submit">Register</button>

</form>

<script>
function validateForm() {
    let valid = true;

    let errors = document.querySelectorAll("span");
    errors.forEach(e => e.innerHTML = "");

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;
    let mobile = document.getElementById("mobile").value.trim();
    let gender = document.querySelector('input[name="gender"]:checked');
    let terms = document.getElementById("terms").checked;

    if (name === "") {
        nameError.innerHTML = "Name is required";
        valid = false;
    }

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        emailError.innerHTML = "Invalid email";
        valid = false;
    }

    if (password.length < 8) {
        passwordError.innerHTML = "Password must be at least 8 characters";
        valid = false;
    }

    if (password !== confirmPassword) {
        confirmPasswordError.innerHTML = "Passwords do not match";
        valid = false;
    }

    if (!/^[0-9]{10}$/.test(mobile)) {
        mobileError.innerHTML = "Mobile must be 10 digits";
        valid = false;
    }

    if (!gender) {
        genderError.innerHTML = "Select gender";
        valid = false;
    }

    if (!terms) {
        termsError.innerHTML = "Accept terms & conditions";
        valid = false;
    }

    if (valid) {
        alert("Form submitted successfully!");
    }

    return valid;
}
</script>

</body>
</html>
